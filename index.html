<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>The Dragon's Spell: Muntaha's Quest</title>
    <style>
      :root {
        --purple: #2d1b4e;
        --purple2: #5b3a8c;
        --gold: #e8b341;
        --gold2: #ffd66b;
        --cream: #f4e8d0;
        --green: #3a6b47;
        --teal: #4fb3bf;
        --ink: #1f1730;
        --mist: rgba(255, 255, 255, 0.13);
        --ok: #68e0a0;
        --soft: #fff6df;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Nunito,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        font-size: 16px;
        color: var(--cream);
        background: radial-gradient(
          circle at 20% 10%,
          #6f55a0 0,
          #2d1b4e 34%,
          #130b25 100%
        );
        overflow-x: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
      }
      .stars,
      .stars:before,
      .stars:after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(#fff8 1px, transparent 1px),
          radial-gradient(#ffd66b99 1px, transparent 1px);
        background-size:
          54px 54px,
          91px 91px;
        background-position:
          0 0,
          28px 17px;
        animation: twinkle 9s linear infinite;
        z-index: -2;
      }
      .stars:before {
        animation-duration: 14s;
        opacity: 0.45;
        transform: scale(1.2);
      }
      .stars:after {
        animation-duration: 20s;
        opacity: 0.3;
        transform: scale(0.8);
      }
      @keyframes twinkle {
        50% {
          opacity: 0.55;
          filter: drop-shadow(0 0 4px #fff);
        }
      }
      .aurora {
        position: fixed;
        inset: auto -20% -30% -20%;
        height: 60vh;
        background:
          radial-gradient(ellipse at 40% 50%, #4fb3bf33, transparent 55%),
          radial-gradient(ellipse at 60% 70%, #e8b34122, transparent 55%);
        filter: blur(20px);
        z-index: -1;
        animation: float 12s ease-in-out infinite alternate;
      }
      @keyframes float {
        to {
          transform: translateY(-35px) scale(1.08);
        }
      }
      h1,
      h2,
      h3 {
        font-family: Cinzel, Georgia, serif;
        letter-spacing: 0.03em;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4.8rem);
        line-height: 1;
        margin: 0;
        text-shadow: 0 0 28px #ffd66b66;
      }
      h2 {
        font-size: clamp(1.6rem, 4vw, 3rem);
        margin: 0.2rem 0 1rem;
      }
      .screen {
        min-height: 100vh;
        padding: 18px;
        display: none;
        animation: fade 0.45s ease;
      }
      .screen.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .center {
        display: grid;
        place-items: center;
        text-align: center;
      }
      .hero {
        max-width: 980px;
        padding: 30px;
        border: 1px solid #ffd66b66;
        border-radius: 30px;
        background: linear-gradient(145deg, #ffffff14, #ffffff08);
        box-shadow:
          0 20px 80px #0008,
          inset 0 0 60px #ffd66b12;
        backdrop-filter: blur(10px);
      }
      .subtitle {
        font-size: clamp(1.05rem, 2.5vw, 1.45rem);
        color: #fff4d6;
        max-width: 780px;
        margin: 18px auto;
        line-height: 1.6;
      }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 13px 20px;
        margin: 6px;
        background: linear-gradient(180deg, var(--gold2), var(--gold));
        color: #251435;
        font-weight: 900;
        box-shadow:
          0 8px 0 #9a671c,
          0 14px 28px #0005;
        transition:
          0.18s transform,
          0.18s filter;
      }
      .btn:hover,
      .btn:focus-visible {
        transform: translateY(-2px);
        filter: brightness(1.06);
        outline: 3px solid #fff8;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 4px 0 #9a671c;
      }
      .btn.secondary {
        background: linear-gradient(180deg, #fff8, #fff2);
        color: var(--cream);
        box-shadow: 0 5px 0 #ffffff20;
      }
      .btn.ghost {
        background: transparent;
        border: 1px solid #ffd66b88;
        color: #ffe9a6;
        box-shadow: none;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        margin: -18px -18px 18px;
        background: #170d2ecc;
        border-bottom: 1px solid #ffd66b33;
        backdrop-filter: blur(10px);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid #ffd66b55;
        border-radius: 999px;
        padding: 8px 12px;
        background: #0003;
        color: #fff6da;
        font-weight: 800;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
        gap: 16px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid #ffd66b55;
        border-radius: 24px;
        background: linear-gradient(150deg, #ffffff18, #ffffff08);
        box-shadow:
          0 12px 34px #0006,
          inset 0 0 30px #fff1;
        padding: 18px;
        position: relative;
        overflow: hidden;
      }
      .realm {
        min-height: 250px;
        text-align: left;
        transition:
          0.25s transform,
          0.25s box-shadow;
      }
      .realm:hover {
        transform: translateY(-5px);
        box-shadow:
          0 18px 50px #0009,
          0 0 35px var(--glow, #ffd66b55);
      }
      .realm.dim {
        filter: saturate(0.7);
        opacity: 0.78;
      }
      .realm svg {
        width: 100%;
        height: 110px;
      }
      .levelbar {
        height: 13px;
        background: #0005;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid #fff3;
      }
      .levelbar > span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--teal), var(--gold2));
        box-shadow: 0 0 14px #ffd66b;
        transition: width 0.8s;
      }
      .map-head {
        max-width: 1180px;
        margin: 0 auto 18px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .aleph {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: #140a27;
        border: 2px solid #ffd66b88;
        box-shadow: 0 0 25px #ffd66b55;
        z-index: 20;
        padding: 3px;
      }
      .aleph svg {
        width: 100%;
        height: 100%;
      }
      .blink {
        animation: blink 5s infinite;
      }
      .beard {
        animation: beard 3s ease-in-out infinite alternate;
        transform-origin: 50% 70%;
      }
      @keyframes blink {
        0%,
        96%,
        100% {
          transform: scaleY(1);
        }
        98% {
          transform: scaleY(0.12);
        }
      }
      @keyframes beard {
        to {
          transform: rotate(2deg);
        }
      }
      .panel {
        max-width: 900px;
        margin: 0 auto;
      }
      .question-card {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 28px;
        background: linear-gradient(160deg, #fff8e8, #f0d9aa);
        color: var(--ink);
        box-shadow: 0 20px 70px #0008;
        border: 3px solid #ffd66b;
      }
      .question-card h2,
      .question-card h3 {
        color: #32174f;
      }
      .prompt {
        font-size: clamp(1.25rem, 3vw, 1.8rem);
        line-height: 1.4;
        font-weight: 900;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .choice {
        padding: 14px;
        border-radius: 16px;
        border: 2px solid #6d4a95;
        background: #fffaf0;
        color: #241435;
        font-weight: 900;
        min-height: 54px;
      }
      .choice[aria-pressed="true"],
      .choice.selected {
        background: #dff8ff;
        border-color: #168b9d;
        box-shadow: 0 0 0 4px #4fb3bf33;
      }
      .input-row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .answer-input {
        font-size: 1.35rem;
        padding: 14px;
        border-radius: 14px;
        border: 2px solid #6d4a95;
        min-width: min(100%, 310px);
        background: white;
        color: #241435;
      }
      .numpad {
        display: grid;
        grid-template-columns: repeat(3, 70px);
        gap: 8px;
        justify-content: center;
        margin: 12px auto;
      }
      .numpad button {
        padding: 14px;
        border: 0;
        border-radius: 13px;
        background: #5b3a8c;
        color: white;
        font-weight: 900;
      }
      .feedback {
        min-height: 48px;
        margin: 12px 0;
        font-weight: 900;
        color: #3b245d;
      }
      .gentle {
        color: #7a4a1d;
      }
      .good {
        color: #14653e;
      }
      .hint {
        background: #fff1c9;
        border-left: 5px solid #e8b341;
        border-radius: 12px;
        padding: 12px;
        margin: 8px 0;
      }
      .saved {
        position: fixed;
        right: 18px;
        bottom: 20px;
        background: #102617;
        color: #d7ffe8;
        border: 1px solid #68e0a0;
        border-radius: 999px;
        padding: 10px 14px;
        opacity: 0;
        transform: translateY(12px);
        transition: 0.25s;
        z-index: 50;
      }
      .saved.show {
        opacity: 1;
        transform: none;
      }
      .pause-cover {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: radial-gradient(circle, #2d1b4ef2, #090412f7);
        display: none;
        place-items: center;
        text-align: center;
      }
      .pause-cover.show {
        display: grid;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #090412cc;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .modal.show {
        display: flex;
      }
      .modal-box {
        max-width: 920px;
        max-height: 90vh;
        overflow: auto;
        background: linear-gradient(155deg, #fff9ea, #ead1a0);
        color: #241435;
        border: 3px solid #ffd66b;
        border-radius: 26px;
        padding: 22px;
        box-shadow: 0 25px 90px #000;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .drag-list {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .tile {
        touch-action: none;
        padding: 14px 16px;
        border-radius: 16px;
        background: #5b3a8c;
        color: #fff;
        font-weight: 900;
        box-shadow: 0 5px 0 #2d1b4e;
      }
      .visual {
        margin: 12px auto;
        max-width: 640px;
        background: #fffdf6;
        border-radius: 16px;
        padding: 10px;
        border: 1px solid #d7bb6c;
        color: #241435;
      }
      .sparkle {
        position: fixed;
        pointer-events: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ffd66b;
        box-shadow: 0 0 12px #fff;
        z-index: 80;
        animation: pop 0.8s ease-out forwards;
      }
      @keyframes pop {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }
      .portal {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: conic-gradient(
          from 0deg,
          transparent,
          #4fb3bf88,
          transparent,
          #ffd66b88,
          transparent
        );
        opacity: 0;
        z-index: 55;
      }
      .portal.spin {
        animation: swirl 0.75s ease;
      }
      @keyframes swirl {
        0% {
          opacity: 0;
          transform: scale(0.2) rotate(0);
        }
        50% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: scale(2.3) rotate(540deg);
        }
      }
      .cutscene {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .scene-art {
        min-height: 230px;
      }
      .spellbook {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      .badge {
        display: inline-block;
        margin: 4px;
        padding: 8px 11px;
        border-radius: 999px;
        background: #2d1b4e;
        color: #fff;
      }
      .danger {
        background: #7b2233;
        color: white;
      }
      .small {
        font-size: 0.92rem;
        opacity: 0.92;
      }
      .sr-only {
        position: absolute;
        left: -10000px;
      }
      .linechart,
      .radar {
        width: 100%;
        max-width: 430px;
        height: auto;
      }
      .bargraph {
        display: flex;
        gap: 8px;
        align-items: end;
        height: 180px;
        padding: 16px;
      }
      .bar {
        flex: 1;
        background: linear-gradient(#4fb3bf, #2d7a83);
        border-radius: 8px 8px 0 0;
        position: relative;
      }
      .bar span {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        font-weight: 900;
      }
      .protractor {
        width: 100%;
        max-width: 420px;
        margin: auto;
        display: block;
      }
      .angle-arm {
        transform-origin: 210px 160px;
        transition: transform 0.3s;
      }
      @media (min-width: 768px) {
        .screen {
          padding: 24px;
        }
        .topbar {
          margin: -24px -24px 22px;
        }
        .cutscene {
          grid-template-columns: 1fr 1.2fr;
          align-items: center;
        }
        .aleph {
          width: 104px;
          height: 104px;
        }
        .question-card {
          padding: 32px;
        }
      }
      @media (max-width: 480px) {
        .btn {
          width: 100%;
          margin: 6px 0;
        }
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }
        .numpad {
          grid-template-columns: repeat(3, 1fr);
          width: 100%;
        }
        .aleph {
          width: 72px;
          height: 72px;
        }
        .question-card {
          padding: 18px;
        }
        .options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="stars"></div>
      <div class="aurora"></div>
      <div class="portal" id="portal"></div>
      <section
        id="home"
        class="screen active center"
        aria-live="polite"
      ></section>
      <section id="diagnostic" class="screen"></section>
      <section id="map" class="screen"></section>
      <section id="cutscene" class="screen"></section>
      <section id="quest" class="screen"></section>
      <section id="settings" class="screen"></section>
      <section id="spellbook" class="screen"></section>
      <button
        class="aleph"
        id="alephBtn"
        aria-label="Master Aleph portrait, secret parent dashboard"
      >
        <svg viewBox="0 0 100 100" role="img" aria-label="Master Aleph">
          <defs>
            <linearGradient id="r" x1="0" x2="1">
              <stop stop-color="#5B3A8C" />
              <stop offset="1" stop-color="#2D1B4E" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="47" fill="#f4e8d0" />
          <path
            d="M18 42Q50 0 82 42L68 37L61 19L52 35L40 12L36 36Z"
            fill="#2d1b4e"
          />
          <path d="M23 50q27-26 54 0v30H23z" fill="url(#r)" />
          <g class="beard">
            <path
              d="M31 50q19 16 38 0q-4 38-19 43Q35 88 31 50"
              fill="#f7f1df"
            />
            <path
              d="M43 68q8 8 15 0"
              stroke="#d6c8ad"
              fill="none"
              stroke-width="2"
            />
          </g>
          <circle cx="38" cy="43" r="3" fill="#241435" class="blink" />
          <circle cx="62" cy="43" r="3" fill="#241435" class="blink" />
          <path
            d="M42 53q8 5 16 0"
            stroke="#7a4a1d"
            stroke-width="2"
            fill="none"
          />
          <g fill="#ffd66b">
            <circle cx="31" cy="28" r="2" />
            <circle cx="70" cy="30" r="2" />
            <path d="M51 9l2 5 5 1-5 2-2 5-2-5-5-2 5-1z" />
          </g>
        </svg>
      </button>
      <div class="saved" id="saved">✨ Saved</div>
      <div class="pause-cover" id="pauseCover">
        <div>
          <h1>Quest Paused</h1>
          <p class="subtitle">
            Master Aleph is holding the spell safely. Tap to resume.
          </p>
          <button class="btn">Resume Quest</button>
        </div>
      </div>
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>
    <script>
      "use strict";
      const $ = (s) => document.querySelector(s),
        $$ = (s) => Array.from(document.querySelectorAll(s));
      const KEY = "muntaha_game_v1",
        now = () => new Date().toISOString(),
        clamp = (n, a, b) => Math.max(a, Math.min(b, n)),
        rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
        pick = (a) => a[rnd(0, a.length - 1)],
        shuffle = (a) =>
          a
            .map((v) => [Math.random(), v])
            .sort((x, y) => x[0] - y[0])
            .map((x) => x[1]);
      const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a)),
        fmt = (n) => Number(n).toLocaleString("en-US"),
        clean = (s) =>
          String(s)
            .toLowerCase()
            .replace(/[,\s-]+/g, " ")
            .trim(),
        title = (s) =>
          s.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      const TOPICS = [
        {
          id: "place_value",
          chapter: 1,
          realm: "The Crystal Caves",
          short: "Place Value",
          icon: "💎",
          color: "#4FB3BF",
          reward: "Glowstone of Places",
          subs: [
            "numerical_form",
            "word_form",
            "place_value_digit",
            "digit_value",
            "rounding",
            "comparing",
            "ordering",
            "patterns",
            "riddles",
          ],
        },
        {
          id: "factors_multiples",
          chapter: 2,
          realm: "The Whispering Woods",
          short: "Factors & Multiples",
          icon: "🌲",
          color: "#3A6B47",
          reward: "Factor Fox Friend",
          subs: [
            "list_factors",
            "identify_multiples",
            "common_factors",
            "number_riddles",
          ],
        },
        {
          id: "operations",
          chapter: 3,
          realm: "The Forge of Four",
          short: "Four Operations",
          icon: "⚒️",
          color: "#E86F41",
          reward: "Fourfold Forge Flame",
          subs: [
            "addition",
            "subtraction",
            "multiplication_3x2",
            "multiply_10_100_1000",
            "division_remainder",
            "long_division_decimal",
            "estimation",
          ],
        },
        {
          id: "word_problems",
          chapter: 4,
          realm: "The Village of Voices",
          short: "Word Problems",
          icon: "🏘️",
          color: "#FFD66B",
          reward: "Village Bell of Equations",
          subs: [
            "multiplication_words",
            "factory_two_step",
            "stadium_two_step",
            "sharing",
            "money_two_step",
            "comparison_per_unit",
            "algebra_style",
          ],
        },
        {
          id: "fractions",
          chapter: 5,
          realm: "The Mirror Lake",
          short: "Fractions",
          icon: "🌊",
          color: "#79C7E3",
          reward: "Mirror Fraction Shard",
          subs: [
            "improper_to_mixed",
            "mixed_to_improper",
            "equivalent",
            "simplify",
            "like_denominators",
            "fraction_words",
            "fraction_of_quantity",
            "multi_fraction",
          ],
        },
        {
          id: "decimals",
          chapter: 6,
          realm: "The Glimmering Glade",
          short: "Decimals",
          icon: "✨",
          color: "#4FB3BF",
          reward: "Decimal Dewdrop Lantern",
          subs: [
            "fraction_to_decimal",
            "decimal_multiply",
            "decimal_add_words",
            "decimal_division_round",
            "decimal_multistep",
            "proportional",
          ],
        },
        {
          id: "angles",
          chapter: 7,
          realm: "The Compass Tower",
          short: "Angles",
          icon: "🧭",
          color: "#B892FF",
          reward: "Compass Shard",
          subs: [
            "identify_angles",
            "measure_angles",
            "draw_angles",
            "straight_line",
            "around_point",
          ],

        gentle() {
          Sound.tone(260, "triangle");
          this.session.hints = Math.min(3, this.session.hints + 1);
          this.session.attempts++;
          $("#feedback").innerHTML =
            '<span class="gentle">Almost! The dragon’s mist is thick here. Let’s look again, apprentice.</span>';
          this.hint();
          if (this.session.attempts > 3) {
            clearInterval(this.timer);
            const rec = AdaptiveEngine.log(
              this.current,
              false,
              this.elapsed(),
              this.session.hints,
              3,
            );
            $("#feedback").innerHTML +=
              `<div class="hint">The spell reveals the answer: <b>${this.current.answer}</b>. We learn and grow.</div>`;
            setTimeout(() => this.next(rec), 1500);
          }
        },
        hint() {
          const q = this.current,
            h =
              q.hints[Math.min(this.session.hints, q.hints.length - 1)] ||
              q.hints[0];
          $("#hintBox").innerHTML +=
            `<div class="hint">Master Aleph whispers a clue: ${h}</div>`;
        },
        next(rec) {
          if (
            rec &&
            rec.wrongStreak >= 2 &&
            !this.session.recheck &&
            !this.session.final
          )
            return this.learnMode(this.current.subSkillId);
          this.session.index++;
          if (this.session.index >= this.session.queue.length)
            return this.sessionDone();
          this.renderQuestion();
        },
        learnMode(sub) {
          const l = StoryEngine.lesson(sub);
          StateManager.state.subSkills[sub].wrongStreak = 0;
          StateManager.state.boost = 2;
          StateManager.save();
          $("#modal").innerHTML =
            `<div class="modal-box"><h2>${l.title}</h2>${l.html}<button class="btn" onclick="UI.closeModal(); UI.session.queue.splice(UI.session.index+1,0,QuestionBank.make('${sub.split(".")[0]}','${sub.split(".").slice(1).join(".")}',1),QuestionBank.make('${sub.split(".")[0]}','${sub.split(".").slice(1).join(".")}',1)); UI.session.index++; UI.renderQuestion();">I am ready, Master Aleph</button></div>`;
          $("#modal").classList.add("show");
        },
        closeModal() {
          $("#modal").classList.remove("show");
        },
        sessionDone() {
          const t = TOPICS.find((x) => x.id === this.session.topicId);
          const secs = Math.round((Date.now() - this.session.started) / 1000);
          if (this.session.final) return this.finalDone();
          if (
            !this.session.recheck &&
            (StateManager.state.chapterCounts[t.id] || 0) >= 25
          )
            return this.startRecheck(t);
          if (this.session.recheck) return this.reward(t, secs);
          $("#quest").innerHTML =
            this.top("Session Complete") +
            `<div class="hero"><h2>${StoryEngine.mid(t)}</h2><p class="subtitle">You solved ${this.session.corrects}/${this.session.queue.length} spells in ${secs}s.</p><button class="btn" onclick="UI.startSession('${t.id}')">Continue Chapter</button><button class="btn secondary" onclick="UI.route('map')">Return to Map</button></div>`;
        },
        startRecheck(t) {
          const old = StateManager.state.skillLevels[t.id];
          this.oldLevel = old;
          $("#quest").innerHTML =
            this.top("Reassessment Checkpoint") +
            `<div class="hero"><h2>Boss Puzzle Gate</h2><p class="subtitle">Before the ${t.reward} awakens, Master Aleph offers five recheck spells from the mistiest skills.</p><button class="btn" onclick="UI.startSession('${t.id}',false,true)">Begin Recheck</button></div>`;
        },
        reward(t, secs) {
          const st = StateManager.state;
          if (!st.inventory.includes(t.reward)) st.inventory.push(t.reward);
          if (!st.storyProgress.completedChapters.includes(t.chapter))
            st.storyProgress.completedChapters.push(t.chapter);
          StateManager.save();
          Sound.tone(1040);
          $("#quest").innerHTML =
            this.top("Realm Restored") +
            `<div class="hero"><h2>✨ ${t.reward} Earned!</h2><p class="subtitle">Your ${t.short} power grew to ${st.skillLevels[t.id].toFixed(1)}/5. A cliffhanger rune appears: Vexel is searching for the Royal Archive...</p><p>Total chapter time today: ${secs}s</p><button class="btn" onclick="UI.route('map')">Return to Wizard's Map</button></div>`;
        },
        endSession() {
          StateManager.save();
          this.route("map");
        },
        startDiagnostic(force = false) {
          if (
            force &&
            !confirm(
              "Begin a fresh 24-question Sorting Hat Ritual? Your progress stays safe.",
            )
          )
            return;
          this.diag = { topicIndex: 0, within: 0, diff: 3, results: {} };
          TOPICS.forEach((t) => (this.diag.results[t.id] = []));
          this.renderDiagnosticQuestion();
        },
        renderDiagnostic() {},
        renderDiagnosticQuestion() {
          this.route("diagnostic");
          const t = TOPICS[this.diag.topicIndex],
            q = QuestionBank.diagnostic(t.id, this.diag.diff);
          this.current = q;
          this.qStart = Date.now();
          this.pauseAccum = 0;
          $("#diagnostic").innerHTML =
            this.questTop() +
            `<div class="question-card"><h2>Sorting Hat Ritual</h2><p class="small">Topic ${this.diag.topicIndex + 1}/8 • Question ${this.diag.within + 1}/3 • ${t.short}</p><div class="prompt">${q.prompt}</div>${this.visual(q)}<div id="answerArea">${this.answerUI(q)}</div><div id="hintBox"></div><div class="feedback" id="feedback"></div><button class="btn" onclick="UI.submitDiagnostic()">Cast Diagnostic Spell</button></div>`;
          this.timer = setInterval(() => this.tick(), 500);
        },
        submitDiagnostic() {
          const q = this.current,
            ans = this.getAns(q),
            ok = q.validate
              ? q.validate(ans)
              : String(ans).replace(/,/g, "").trim() === String(q.answer);
          clearInterval(this.timer);
          AdaptiveEngine.diagnosticUpdate(q.topicId, ok, this.diag.diff);
          this.diag.results[q.topicId].push(ok);
          $("#feedback").innerHTML = ok
            ? '<span class="good">The Sorting Hat glows!</span>'
            : '<span class="gentle">The Sorting Hat makes a gentle note.</span>';
          this.diag.diff = clamp(this.diag.diff + (ok ? 1 : -1), 1, 5);
          this.diag.within++;
          setTimeout(() => {
            if (this.diag.within >= 3) {
              this.diag.topicIndex++;
              this.diag.within = 0;
              this.diag.diff = 3;
            }
            if (this.diag.topicIndex >= TOPICS.length) {
              StateManager.state.diagnosticCompleted = true;
              StateManager.save();
              this.route("map");
            } else this.renderDiagnosticQuestion();
          }, 650);
        },
        finalBattle() {
          this.startSession(TOPICS[0].id, true, false);
        },
        finalDone() {
          const name = StateManager.state.player.name;
          $("#quest").innerHTML =
            this.top("Final Confrontation") +
            `<div class="hero"><h1>Vexel's Curse Breaks!</h1><p class="subtitle">${name}, every correct spell sent light back into a realm. Master Aleph bows proudly: “Numeria shall remember the apprentice who chose courage and practice.”</p><button class="btn" onclick="UI.route('map')">Celebrate on the Map</button></div>`;
        },
        renderSettings() {
          const st = StateManager.state;
          $("#settings").innerHTML =
            this.top("Settings") +
            `<div class="panel card"><h2>Settings & Backup</h2><label>Player name <input class="answer-input" id="pname" value="${st.player.name}"></label><p><label><input type="checkbox" id="sound" ${st.settings.soundOn ? "checked" : ""}> Sound magic on</label></p><p><label>Parent passcode <input class="answer-input" id="pass" value="${st.settings.parentPasscode}" type="password"></label></p><button class="btn" onclick="UI.saveSettings()">Save Settings</button><button class="btn secondary" onclick="StateManager.export()">Export Progress</button><label class="btn secondary">Import Progress <input type="file" accept="application/json" style="display:none" onchange="StateManager.import(this.files[0])"></label><hr><h3>Parent Dashboard</h3><input class="answer-input" id="parentCode" placeholder="Enter passcode"><button class="btn" onclick="ParentDashboard.open()">Open Dashboard</button></div>`;
        },
        saveSettings() {
          const st = StateManager.state;
          st.player.name = $("#pname").value || "Muntaha";
          st.settings.soundOn = $("#sound").checked;
          st.settings.parentPasscode = $("#pass").value || "4321";
          StateManager.save();
          this.route("map");
        },
        renderSpellbook() {
          const st = StateManager.state;
          $("#spellbook").innerHTML =
            this.top("Spellbook") +
            `<div class="panel"><h2>${st.player.name}'s Spellbook</h2><div class="spellbook"><div class="card"><h3>Inventory</h3>${st.inventory.length ? st.inventory.map((i) => `<span class="badge">${i}</span>`).join("") : "<p>No relics yet. The first one waits in the Crystal Caves.</p>"}</div><div class="card"><h3>Power Radar</h3>${ParentDashboard.radar()}</div><div class="card"><h3>Mastered Skills</h3>${
              Object.entries(st.subSkills)
                .filter(([, v]) => v.mastered)
                .slice(0, 20)
                .map(
                  ([k]) =>
                    `<span class="badge">${title(k.split(".")[1])}</span>`,
                )
                .join("") || "Keep practicing; mastery sparks soon."
            }</div></div></div>`;
        },
        sparkles() {
          for (let i = 0; i < 22; i++) {
            const e = document.createElement("i");
            e.className = "sparkle";
            e.style.left = innerWidth / 2 + rnd(-120, 120) + "px";
            e.style.top = innerHeight / 2 + rnd(-80, 80) + "px";
            e.style.setProperty("--dx", rnd(-180, 180) + "px");
            e.style.setProperty("--dy", rnd(-180, 80) + "px");
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 850);
          }
        },
      };
      const ParentDashboard = {
        open(secret = false) {
          if (
            !secret &&
            $("#parentCode")?.value !==
              StateManager.state.settings.parentPasscode
          ) {
            alert("Master Aleph keeps this dashboard for parents.");
            return;
          }
          const st = StateManager.state,
            top = Object.entries(st.subSkills)
              .sort((a, b) => b[1].struggleScore - a[1].struggleScore)
              .slice(0, 3);
          $("#modal").innerHTML =
            `<div class="modal-box"><h2>Parent Dashboard</h2><div class="grid"><div class="card"><h3>Skill Levels</h3>${this.radar()}</div><div class="card"><h3>Time by Topic</h3>${TOPICS.map((t) => `<p>${t.short}: ${Math.round(st.timeByTopic[t.id].total / 60)} min total / ${Math.round(st.timeByTopic[t.id].week / 60)} min this week</p>`).join("")}</div><div class="card"><h3>Top 3 Struggle Sub-skills Right Now</h3>${top.map(([k, v]) => `<p><b>${title(k)}</b> — score ${v.struggleScore}<br><span class="small">Example: ${(v.examples && v.examples[0]?.question) || "No missed example yet."}</span></p>`).join("")}</div><div class="card"><h3>Accuracy Trend (7 days)</h3>${this.trend()}</div><div class="card"><h3>Suggested Offline Activities</h3><ul><li>For fractions: cook together and ask, “If we use 2/3, how much is left?”</li><li>For place value: read car number plates and name each digit's place.</li><li>For data: make a family fruit bar chart after dinner.</li></ul></div><div class="card"><h3>Mastered</h3>${
              Object.entries(st.subSkills)
                .filter(([, v]) => v.mastered)
                .map(([k]) => `<span class="badge">${title(k)}</span>`)
                .join("") || "None yet."
            }</div></div><button class="btn secondary" onclick="UI.closeModal()">Close</button><button class="btn danger" onclick="if(confirm('Reset all progress?')) StateManager.reset()">Reset Progress</button></div>`;
          $("#modal").classList.add("show");
        },
        radar() {
          const vals = TOPICS.map(
              (t) => StateManager.state.skillLevels[t.id] / 5,
            ),
            cx = 180,
            cy = 165,
            r = 115,
            pts = vals
              .map((v, i) => {
                const a = -Math.PI / 2 + (i * 2 * Math.PI) / vals.length;
                return [cx + Math.cos(a) * r * v, cy + Math.sin(a) * r * v];
              })
              .map((p) => p.join(","))
              .join(" ");
          const axes = TOPICS.map((t, i) => {
            const a = -Math.PI / 2 + (i * 2 * Math.PI) / TOPICS.length,
              x = cx + Math.cos(a) * r,
              y = cy + Math.sin(a) * r,
              lx = cx + Math.cos(a) * (r + 32),
              ly = cy + Math.sin(a) * (r + 32);
            return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#5B3A8C55"/><text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#241435">${TOPICS[i].short.split(" ")[0]}</text>`;
          }).join("");
          return `<svg class="radar" viewBox="0 0 360 330"><polygon points="${pts}" fill="#4FB3BF88" stroke="#2D1B4E" stroke-width="3"/>${axes}<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E8B341"/></svg>`;
        },
        trend() {
          const logs = StateManager.state.logs.slice(-60),
            days = [6, 5, 4, 3, 2, 1, 0].map((d) => {
              const dt = new Date();
              dt.setDate(dt.getDate() - d);
              return dt.toDateString();
            });
          const rates = days.map((day) => {
            const l = logs.filter(
              (x) => new Date(x.timestamp).toDateString() === day,
            );
            return l.length
              ? l.filter((x) => x.correct).length / l.length
              : 0.5;
          });
          const pts = rates
            .map((v, i) => `${30 + i * 45},${130 - v * 100}`)
            .join(" ");
          return `<svg class="linechart" viewBox="0 0 330 155"><polyline points="${pts}" fill="none" stroke="#4FB3BF" stroke-width="4"/><line x1="25" y1="130" x2="310" y2="130" stroke="#32174f"/><text x="20" y="25" fill="#241435">100%</text><text x="20" y="135" fill="#241435">0%</text></svg>`;
        },
      };
      $("#pauseCover").addEventListener("click", () => UI.resume());
      let taps = [];
      $("#alephBtn").addEventListener("click", () => {
        const t = Date.now();
        taps = taps.filter((x) => t - x < 3000);
        taps.push(t);
        if (taps.length >= 5) {
          taps = [];
          ParentDashboard.open(true);
        }
      });
      StateManager.load();
      QuestionBank.selfTest();
      UI.renderHome();
    </script>
  </body>
</html>
